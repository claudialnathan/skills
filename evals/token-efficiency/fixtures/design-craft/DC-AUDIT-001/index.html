<main class="dashboard">
  <header class="dashboard-header">
    <div>
      <p class="eyebrow">Workspace</p>
      <h1>Account health</h1>
    </div>
    <button class="button danger">Delete workspace</button>
  </header>
  <section class="metrics" aria-label="Account metrics">
    <article class="metric primary">
      <p>Reliability</p>
      <strong>99.98%</strong>
      <span>Within target</span>
    </article>
    <article class="metric accented">
      <p>Open incidents</p>
      <strong>2</strong>
      <span>One needs review</span>
    </article>
    <article class="metric accented">
      <p>Monthly spend</p>
      <strong>$14,280</strong>
      <span>8% below forecast</span>
    </article>
  </section>
</main>
